<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>AQLJANGI</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#090914;
 color:white;
 min-height:100vh;
 padding:20px;
}
.container{max-width:600px;margin:auto}
.logo{text-align:center;font-size:50px;margin-top:25px}
h1{text-align:center;font-size:34px;margin:8px 0}
.sub{text-align:center;color:#aaa;margin-bottom:25px}
.card{
 background:#151526;
 border:1px solid #292942;
 border-radius:22px;
 padding:22px;
 margin-bottom:18px;
}
.progress{
 height:8px;
 background:#292942;
 border-radius:10px;
 overflow:hidden;
 margin-bottom:20px;
}
.progress div{
 height:100%;
 background:linear-gradient(90deg,#7c3aed,#ec4899);
 transition:.3s;
}
.qnum{color:#aaa;font-size:14px;margin-bottom:12px}
.question{font-size:22px;line-height:1.35;font-weight:bold}
.answer{
 width:100%;
 border:1px solid #353550;
 background:#1c1c30;
 color:white;
 padding:17px;
 border-radius:15px;
 margin-top:12px;
 text-align:left;
 font-size:17px;
}
.answer:active{transform:scale(.98)}
.correct{background:#126b43!important;border-color:#22c55e!important}
.wrong{background:#762b35!important;border-color:#ef4444!important}
.btn{
 width:100%;
 border:0;
 padding:18px;
 border-radius:18px;
 background:linear-gradient(90deg,#7c3aed,#ec4899);
 color:white;
 font-size:18px;
 font-weight:bold;
 margin-top:15px;
}
.center{text-align:center}
.score{font-size:55px;font-weight:bold;margin:20px}
.hidden{display:none}
.small{color:#aaa}
</style>
</head>

<body>

<div class="container">

<div id="start">
 <div class="logo">🧠</div>
 <h1>AQLJANGI</h1>
 <div class="sub">Bilimingizni sinab ko‘ring!</div>

 <div class="card">
  <h2>🎯 O‘yin qoidalari</h2>
  <p>• 10 ta savol</p>
  <p>• Har bir savol — 10 ball</p>
  <p>• Savollar bazadan tasodifiy olinadi</p>
  <p>• Natijangiz oxirida ko‘rsatiladi</p>
 </div>

 <button class="btn" onclick="startGame()">🚀 O‘yinni boshlash</button>
</div>


<div id="game" class="hidden">

 <div class="card">
  <div class="qnum" id="qnum"></div>

  <div class="progress">
   <div id="progress"></div>
  </div>

  <div class="question" id="question"></div>

  <div id="answers"></div>
 </div>

</div>


<div id="result" class="hidden center">

 <div class="logo">🏆</div>
 <h1>Natija</h1>

 <div class="card">
  <div class="score" id="score"></div>
  <div id="resultText"></div>
 </div>

 <button class="btn" onclick="startGame()">🔄 Yana o‘ynash</button>

</div>

</div>


<script>

const SUPABASE_URL =
"https://ayzdzhodjdzsoxovckrc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_SVjbLTpmwn4z3lYtC3kZhg_obMt1k8p";

const tg = window.Telegram?.WebApp;

if(tg){
 tg.ready();
 tg.expand();
}

let questions=[];
let current=0;
let score=0;


/* SUPABASE'DAN 10 TA TASODIFIY SAVOL */

async function getQuestions(){

 const random=Math.random();

 const url =
 SUPABASE_URL +
 "/rest/v1/questions" +
 "?select=*" +
 "&random_key=gte." + random +
 "&order=random_key.asc" +
 "&limit=10";

 const response = await fetch(url,{
  headers:{
   "apikey":SUPABASE_KEY,
   "Authorization":"Bearer "+SUPABASE_KEY
  }
 });

 if(!response.ok){
  throw new Error("Supabase xatosi");
 }

 let data=await response.json();

 /* Agar random joydan 10 ta chiqmasa, boshidan olamiz */

 if(data.length<10){

  const url2 =
  SUPABASE_URL +
  "/rest/v1/questions" +
  "?select=*" +
  "&random_key=lt." + random +
  "&order=random_key.asc" +
  "&limit="+(10-data.length);

  const response2=await fetch(url2,{
   headers:{
    "apikey":SUPABASE_KEY,
    "Authorization":"Bearer "+SUPABASE_KEY
   }
  });

  const data2=await response2.json();

  data=[...data,...data2];
 }

 return data;
}


/* O‘YINNI BOSHLASH */

async function startGame(){

 document.getElementById("start").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");

 current=0;
 score=0;

 document.getElementById("question").innerText="⏳ Savollar yuklanmoqda...";
 document.getElementById("answers").innerHTML="";

 try{

  questions=await getQuestions();

  if(!questions.length){
   throw new Error("Savollar topilmadi");
  }

  showQuestion();

 }catch(error){

  console.error(error);

  document.getElementById("question").innerText=
  "❌ Savollarni yuklab bo‘lmadi.";

  document.getElementById("answers").innerHTML=
  "<p class='small'>Supabase ulanishini tekshiring.</p>";

 }

}


/* SAVOLNI KO‘RSATISH */

function showQuestion(){

 const q=questions[current];

 document.getElementById("qnum").innerText=
 "Savol "+(current+1)+" / "+questions.length;

 document.getElementById("progress").style.width=
 ((current+1)/questions.length*100)+"%";

 document.getElementById("question").innerText=
 q.question;

 const answers=document.getElementById("answers");
 answers.innerHTML="";

 const options=[
  ["A",q.option_a],
  ["B",q.option_b],
  ["C",q.option_c],
  ["D",q.option_d]
 ];

 options.forEach(([letter,text])=>{

  const btn=document.createElement("button");

  btn.className="answer";
  btn.innerText=letter+". "+text;

  btn.onclick=()=>checkAnswer(btn,letter);

  answers.appendChild(btn);

 });

}


/* JAVOBNI TEKSHIRISH */

function checkAnswer(button,letter){

 const q=questions[current];

 const buttons=document.querySelectorAll(".answer");

 buttons.forEach(b=>b.disabled=true);

 let correct=
 String(q.correct_answer).trim().toUpperCase();

 if(correct===letter){

  button.classList.add("correct");
  score+=10;

 }else{

  button.classList.add("wrong");

  buttons.forEach(b=>{

   if(b.innerText.startsWith(correct+".")){
    b.classList.add("correct");
   }

  });

 }

 setTimeout(()=>{

  current++;

  if(current<questions.length){
   showQuestion();
  }else{
   showResult();
  }

 },700);

}


/* NATIJA */

function showResult(){

 document.getElementById("game").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");

 document.getElementById("score").innerText=
 score+" / "+(questions.length*10);

 let text="";

 if(score===100){
  text="🔥 Ajoyib! Siz haqiqiy topqirsiz!";
 }else if(score>=70){
  text="👏 Juda yaxshi natija!";
 }else if(score>=50){
  text="👍 Yomon emas!";
 }else{
  text="💪 Yana urinib ko‘ring!";
 }

 document.getElementById("resultText").innerText=text;

}

</script>

</body>
</html>
