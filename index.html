<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;

}

body{
  background:#090914;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,
  "Segoe UI",Arial,sans-serif;
}

button{
  font-family:inherit;
}

.hide{
  display:none !important;
}

.container{
  width:100%;
  max-width:700px;
  margin:0 auto;
  padding:18px 16px 35px;
}


/* =========================
   HEADER
========================= */

.header{
  text-align:center;
  padding:10px 0 18px;
}

.logo{
  font-size:46px;
  line-height:1;
  margin-bottom:8px;
}

.logo-title{
  font-size:30px;
  font-weight:900;
  letter-spacing:.5px;
}

.logo-sub{
  color:#aaa;
  font-size:15px;
  margin-top:5px;
}


/* =========================
   STAT BADGES
========================= */

.badges{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;
  margin:14px 0;
}

.badge{
  background:#17172a;
  border:1px solid #30304a;
  border-radius:20px;
  padding:7px 11px;
  font-size:12px;
  color:#ddd;
}


/* =========================
   CARD
========================= */

.card{
  background:#151523;
  border:1px solid #303047;
  border-radius:22px;
  padding:16px;
  margin-top:12px;
  box-shadow:0 10px 35px rgba(0,0,0,.25);
}


/* =========================
   CATEGORY
========================= */

.category-title{
  text-align:center;
  font-size:20px;
  font-weight:800;
  margin-bottom:13px;
}

.category-sub{
  text-align:center;
  color:#aaa;
  font-size:13px;
  margin-bottom:15px;
}

.categories{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.cat{
  border:1px solid #333250;
  border-radius:14px;
  padding:9px 6px;
  min-height:72px;

  background:#24213f;
  color:#fff;

  font-size:14px;
  font-weight:800;

  cursor:pointer;

  transition:
    transform .15s,
    background .15s;
}

.cat:active{
  transform:scale(.96);
}

.cat:disabled{
  opacity:.5;
}


/* =========================
   MAIN BUTTON
========================= */

.btn{
  width:100%;
  border:0;
  border-radius:16px;

  padding:14px 15px;

  margin-top:12px;

  background:
    linear-gradient(
      135deg,
      #6d35ff,
      #bd42ff
    );

  color:#fff;

  font-size:16px;
  font-weight:800;

  cursor:pointer;
}

.btn:active{
  transform:scale(.98);
}

.back-btn{
  background:#282641;
}


/* =========================
   GAME HEADER
========================= */

.game-top{
  display:flex;
  justify-content:space-between;
  align-items:center;

  font-size:16px;
  color:#ddd;

  margin-bottom:9px;
}

.game-info{
  display:flex;
  justify-content:space-between;

  color:#aaa;

  font-size:14px;

  margin-bottom:8px;
}


/* =========================
   PROGRESS
========================= */

.progress{
  width:100%;
  height:7px;

  background:#29283d;

  border-radius:20px;

  overflow:hidden;

  margin-bottom:18px;
}

.progress-bar{
  height:100%;
  width:0%;

  background:
    linear-gradient(
      90deg,
      #743cff,
      #c743ff
    );

  transition:.3s;
}


/* =========================
   QUESTION
========================= */

.question{
  font-size:20px;
  font-weight:800;

  line-height:1.45;

  margin:8px 0 18px;
}


/* =========================
   OPTIONS
========================= */

.option{
  display:block;

  width:100%;

  text-align:left;

  border:1px solid #36354e;

  background:#1c1b2c;

  color:#fff;

  border-radius:14px;

  padding:14px 13px;

  margin:8px 0;

  font-size:15px;

  line-height:1.35;

  cursor:pointer;

  transition:.15s;
}

.option:active{
  transform:scale(.985);
}

.option.correct{
  background:#123c2a;
  border-color:#35d58a;
}

.option.wrong{
  background:#401b24;
  border-color:#ff5669;
}

.option:disabled{
  cursor:default;
}


/* =========================
   ERROR
========================= */

.error{
  margin-top:14px;

  padding:14px;

  border-radius:14px;

  background:#391923;

  border:1px solid #ff5368;

  color:#ffdce1;

  font-size:14px;

  line-height:1.5;

  word-break:break-word;
}


/* =========================
   RESULT
========================= */

.result-icon{
  text-align:center;
  font-size:55px;
}

.result-title{
  text-align:center;
  font-size:25px;
  font-weight:900;
}

.result-category{
  text-align:center;
  color:#aaa;
  margin-top:5px;
}

.result-score{
  text-align:center;

  font-weight:900;

  margin:18px 0 5px;
}

.result-correct{
  text-align:center;
  color:#ddd;
  font-size:15px;
}


/* =========================
   HISTORY
========================= */

.history-title{
  text-align:center;

  font-size:20px;
  font-weight:900;

  margin-bottom:10px;
}

.total-score{
  text-align:center;

  background:#211d3a;

  border:1px solid #383157;

  border-radius:14px;

  padding:12px;

  margin-bottom:12px;

  font-size:16px;
}

.history-item{
  background:#1b1a2b;

  border:1px solid #303047;

  border-radius:13px;

  padding:11px;

  margin-top:8px;
}

.history-row{
  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:10px;

  font-size:14px;
}

.history-small{
  color:#999;
  font-size:12px;
  margin-top:5px;
}


/* =========================
   HELP
========================= */

.help{
  text-align:center;

  color:#aaa;

  font-size:12px;

  margin-top:14px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:420px){

  .container{

  }

  .question{
    font-size:18px;
  }

  .option{
    font-size:14px;
    padding:13px 11px;
  }

}

</style>

<script>

/* =====================================================
   TELEGRAM
===================================================== */

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;


if(tg){

  tg.ready();

  tg.expand();

}



/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://ayzdzhodjdzsoxovckrc.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_SVjbLTpmwn4z3lYtC3kZhg_obMt1k8p";


const GAME_SIZE = 10;



/* =====================================================
   GAME VARIABLES
===================================================== */

let questions = [];

let currentQuestion = 0;

let currentScore = 0;

let correctAnswers = 0;

let answered = false;

let selectedCategory = "";



/* =====================================================
   HISTORY
===================================================== */

let gameHistory =
  JSON.parse(
    localStorage.getItem(
      "aqljangi_history"
    ) || "[]"
  );


let totalScore =
  Number(
    localStorage.getItem(
      "aqljangi_total_score"
    ) || 0
  );



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(char){

        const map = {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"

        };

        return map[char];

      }
    );

}



/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array){

  const result = [...array];

  for(
    let i = result.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      result[i],
      result[j]
    ] =
    [
      result[j],
      result[i]
    ];

  }

  return result;

}



/* =====================================================
   LOAD QUESTIONS
===================================================== */

async function loadQuestions(category){

  const encodedCategory =
    encodeURIComponent(category);


  const randomNumber =
    Math.random();


  /*
    MUHIM:

    Bu yerda ID olinmaydi.

    Eski:
    select=id,...

    YO‘Q.

    Yangi:
    select=question,...
  */


  const selectFields =
    "question,option_a,option_b,option_c,option_d,correct_answer,category";


  /* =========================
     BIRINCHI SO‘ROV
  ========================= */

  const url1 =
    SUPABASE_URL +
    "/rest/v1/questions" +
    "?select=" +
    selectFields +
    "&category=eq." +
    encodedCategory +
    "&random_key=gte." +
    randomNumber +
    "&order=random_key.asc" +
    "&limit=100";


  let response =
    await fetch(
      url1,
      {
        method:"GET",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " +
            SUPABASE_KEY
        }
      }
    );


  let data = [];


  if(response.ok){

    data =
      await response.json();

  }


  /* =========================
     IKKINCHI SO‘ROV
  ========================= */

  if(
    !Array.isArray(data) ||
    data.length < GAME_SIZE
  ){

    const url2 =
      SUPABASE_URL +
      "/rest/v1/questions" +
      "?select=" +
      selectFields +
      "&category=eq." +
      encodedCategory +
      "&random_key=lt." +
      randomNumber +
      "&order=random_key.desc" +
      "&limit=100";


    const response2 =
      await fetch(
        url2,
        {
          method:"GET",

          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer " +
              SUPABASE_KEY
          }
        }
      );


    if(response2.ok){

      const data2 =
        await response2.json();


      if(
        Array.isArray(data2)
      ){

        data =
          data.concat(data2);

      }

    }

  }


  /* =========================
     TAKROR SAVOLLARNI OLIB TASHLASH
  ========================= */

  const uniqueQuestions = [];

  const usedQuestions = new Set();


  for(
    const question of data
  ){

    const key =
      String(
        question.question || ""
      )
      .trim()
      .toLowerCase();


    if(!key){
      continue;
    }


    if(
      usedQuestions.has(key)
    ){
      continue;
    }


    usedQuestions.add(key);

    uniqueQuestions.push(
      question
    );


    if(
      uniqueQuestions.length >= GAME_SIZE
    ){
      break;
    }

  }


  if(
    uniqueQuestions.length >= GAME_SIZE
  ){

    return shuffle(
      uniqueQuestions
    ).slice(
      0,
      GAME_SIZE
    );

  }


  throw new Error(
    "Bu kategoriyada yetarli savol topilmadi."
  );

}



/* =====================================================
   START GAME
===================================================== */

async function startGame(category){

  selectedCategory =
    category;


  document
    .getElementById("homeError")
    .innerHTML = "";


  document
    .querySelectorAll(".cat")
    .forEach(
      button => {
        button.disabled = true;
      }
    );


  try{

    questions =
      await loadQuestions(
        category
      );


    currentQuestion = 0;

    currentScore = 0;

    correctAnswers = 0;

    answered = false;


    document
      .getElementById("home")
      .classList
      .add("hide");


    document
      .getElementById("result")
      .classList
      .add("hide");


    document
      .getElementById("game")
      .classList
      .remove("hide");


    document
      .getElementById("categoryName")
      .textContent =
      category;


    document
      .getElementById("scoreTop")
      .textContent =
      "⭐ 0 ball";


    if(
      tg &&
      tg.BackButton
    ){

      tg.BackButton.show();

      tg.BackButton.onClick(
        goHome
      );

    }


    showQuestion();

  }
  catch(error){

    document
      .getElementById("homeError")
      .innerHTML =
      `
      <div class="error">
        ❌ Savollarni yuklashda xato.<br><br>
        ${escapeHTML(error.message)}
      </div>
      `;

  }
  finally{

    document
      .querySelectorAll(".cat")
      .forEach(
        button => {
          button.disabled = false;
        }
      );

  }

}



/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion(){

  answered = false;


  const q =
    questions[
      currentQuestion
    ];


  document
    .getElementById("questionNumber")
    .textContent =
    (
      currentQuestion + 1
    ) +
    " / " +
    questions.length;


  document
    .getElementById("progressBar")
    .style.width =
    (
      (
        currentQuestion /
        questions.length
      ) *
      100
    ) +
    "%";


  document
    .getElementById("question")
    .textContent =
    q.question ||
    "Savol";


  const options = [

    {
      key:"A",
      text:q.option_a
    },

    {
      key:"B",
      text:q.option_b
    },

    {
      key:"C",
      text:q.option_c
    },

    {
      key:"D",
      text:q.option_d
    }

  ];


  const optionsBox =
    document
      .getElementById("options");


  optionsBox.innerHTML =
    options
      .map(
        option => `
          <button
            class="option"
            data-key="${option.key}"
          >
            <b>${option.key}.</b>
            ${escapeHTML(option.text)}
          </button>
        `
      )
      .join("");


  optionsBox
    .querySelectorAll(".option")
    .forEach(
      button => {

        button.onclick =
          function(){

            checkAnswer(
              button,
              q.correct_answer
            );

          };

      }
    );


  document
    .getElementById("nextBtn")
    .classList
    .add("hide");

}



/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer(
  selectedButton,
  correctAnswer
){

  if(answered){
    return;
  }


  answered = true;


  const selected =
    selectedButton
      .dataset
      .key;


  const correct =
    String(
      correctAnswer || ""
    )
    .trim()
    .toUpperCase();


  document
    .querySelectorAll(".option")
    .forEach(
      button => {

        button.disabled = true;


        if(
          button.dataset.key === correct
        ){

          button.classList
            .add("correct");

        }

      }
    );


  if(
    selected === correct
  ){

    currentScore += 10;

    correctAnswers++;


  }else{

    selectedButton
      .classList
      .add("wrong");

  }


  document
    .getElementById("scoreTop")
    .textContent =
    "⭐ " +
    currentScore +
    " ball";


  document
    .getElementById("progressBar")
    .style.width =
    (
      (
        (currentQuestion + 1) /
        questions.length
      ) *
      100
    ) +
    "%";


  const nextButton =
    document
      .getElementById("nextBtn");


  if(
    currentQuestion ===
    questions.length - 1
  ){

    nextButton.textContent =
      "🏆 Natijani ko‘rish";

  }else{

    nextButton.textContent =
      "Keyingi savol ➜";

  }


  nextButton
    .classList
    .remove("hide");


  if(
    tg &&
    tg.HapticFeedback
  ){

    tg.HapticFeedback
      .impactOccurred(
        selected === correct
          ? "light"
          : "medium"
      );

  }

}



/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion(){

  if(!answered){
    return;
  }


  if(
    currentQuestion <
    questions.length - 1
  ){

    currentQuestion++;

    showQuestion();

  }else{

    showResult();

  }

}



/* =====================================================
   SAVE HISTORY
===================================================== */

function saveGame(){

  totalScore +=
    currentScore;


  localStorage.setItem(
    "aqljangi_total_score",
    String(totalScore)
  );


  const game = {

    category:
      selectedCategory,

    score:
      currentScore,

    correct:
      correctAnswers,

    total:
      questions.length,

    date:
      new Date()
        .toLocaleString(
          "uz-UZ"
        )

  };


  gameHistory.unshift(
    game
  );


  /*
    Faqat oxirgi 20 ta
    o‘yin saqlanadi.
  */

  gameHistory =
    gameHistory.slice(
      0,
      20
    );


  localStorage.setItem(
    "aqljangi_history",
    JSON.stringify(
      gameHistory
    )
  );

}



/* =====================================================
   SHOW RESULT
===================================================== */

function showResult(){

  saveGame();


  document
    .getElementById("game")
    .classList
    .add("hide");


  document
    .getElementById("result")
    .classList
    .remove("hide");


  document
    .getElementById("resultCategory")
    .textContent =
    "📚 " +
    selectedCategory;


  document
    .getElementById("resultScore")
    .textContent =
    currentScore +
    " / 100";


  document
    .getElementById("resultCorrect")
    .textContent =
    "✅ To‘g‘ri javoblar: " +
    correctAnswers +
    " / " +
    questions.length;


  let message;


  if(
    currentScore >= 90
  ){

    message =
      "🔥 Ajoyib natija!";

  }
  else if(
    currentScore >= 70
  ){

    message =
      "👏 Juda yaxshi!";

  }
  else if(
    currentScore >= 50
  ){

    message =
      "👍 Yaxshi!";

  }
  else{

    message =
      "💪 Yana urinib ko‘ring!";

  }


  document
    .getElementById("resultText")
    .innerHTML =
    `
      ${message}<br><br>
      🏆 O‘yinlardan jami:
      <b>${totalScore} ball</b>
    `;


  if(
    tg &&
    tg.BackButton
  ){

    tg.BackButton.hide();

  }

}



/* =====================================================
   GO HOME
===================================================== */

function goHome(){

  document
    .getElementById("game")
    .classList
    .add("hide");


  document
    .getElementById("result")
    .classList
    .add("hide");


  document
    .getElementById("home")
    .classList
    .remove("hide");


  if(
    tg &&
    tg.BackButton
  ){

    tg.BackButton.hide();

  }


  renderHistory();

}



/* =====================================================
   RENDER HISTORY
===================================================== */

function renderHistory(){

  const box =
    document
      .getElementById(
        "historyBox"
      );


  let html = `

    <div class="history-title">
      📊 O‘yin tarixi
    </div>

    <div class="total-score">
      🏆 O‘yinlardan jami:
      <b>${totalScore} ball</b>
    </div>

  `;


  if(
    gameHistory.length === 0
  ){

    html += `

      <div
        style="
          text-align:center;
          color:#999;
          font-size:13px;
          padding:8px;
        "
      >
        Hali o‘yin o‘ynalmagan.
      </div>

    `;

  }else{

    gameHistory.forEach(
      function(game,index){

        html += `

          <div class="history-item">

            <div class="history-row">

              <b>
                ${index + 1}.
                ${escapeHTML(
                  game.category
                )}
              </b>

              <b>
                ⭐ ${game.score}
              </b>

            </div>

            <div class="history-small">

              ✅
              ${game.correct}/${game.total}

              &nbsp; • &nbsp;

              ${escapeHTML(
                game.date
              )}

            </div>

          </div>

        `;

      }
    );

  }


  box.innerHTML =
    html;

}



/* =====================================================
   CATEGORY BUTTONS
===================================================== */

document
  .querySelectorAll(".cat")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        function(){

          startGame(
            button.dataset.category
          );

        }
      );

    }
  );



/* =====================================================
   NEXT BUTTON
===================================================== */

document
  .getElementById("nextBtn")
  .addEventListener(
    "click",
    nextQuestion
  );



/* =====================================================
   BACK BUTTON
===================================================== */

document
  .getElementById("backBtn")
  .addEventListener(
    "click",
    goHome
  );



/* =====================================================
   AGAIN
===================================================== */

document
  .getElementById("againBtn")
  .addEventListener(
    "click",
    function(){

      startGame(
        selectedCategory
      );

    }
  );



/* =====================================================
   CATEGORY
===================================================== */

document
  .getElementById("categoryBtn")
  .addEventListener(
    "click",
    goHome
  );



/* =====================================================
   SHOW HISTORY ON START
===================================================== */

renderHistory();

</script>

</body>
</html>
