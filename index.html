<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>TOPQIR — AQLJANGI</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#090914;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100vh;
}

.wrap{
  max-width:650px;
  margin:auto;
  padding:16px;
}

.hide{
  display:none!important;
}

/* LOGO */
.top{
  text-align:center;
  padding:10px 0 18px;
}

.logo{
  font-size:48px;
}

.title{
  font-size:32px;
  font-weight:900;
}

.sub{
  color:#aaa;
  margin-top:6px;
}

/* BADGES */
.badges{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
  margin:14px 0;
}

.badge{
  background:#17172a;
  border:1px solid #30304b;
  border-radius:20px;
  padding:7px 12px;
  color:#ddd;
  font-size:13px;
}

/* CARD */
.card{
  background:#121221;
  border:1px solid #292944;
  border-radius:22px;
  padding:18px;
  margin-top:14px;
  box-shadow:0 12px 35px #0005;
}

/* CATEGORY */
.category-title{
  text-align:center;
  font-size:21px;
  font-weight:800;
  margin:3px 0 14px;
}

.categories{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.cat{
  border:1px solid #30304b;
  border-radius:13px;
  padding:10px 7px;
  background:#19192b;
  color:#fff;
  font-size:14px;
  font-weight:700;
  min-height:72px;
  cursor:pointer;
}

.cat:active{
  transform:scale(.97);
}

.cat:disabled{
  opacity:.5;
}

/* BUTTON */
.btn{
  width:100%;
  border:0;
  border-radius:16px;
  padding:15px;
  font-size:17px;
  font-weight:800;
  color:#fff;
  background:linear-gradient(135deg,#6d45ff,#a33cff);
  margin-top:14px;
  cursor:pointer;
}

.btn:disabled{
  opacity:.5;
}

.back{
  background:#25243d;
}

/* GAME */
.game-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#ddd;
  margin-bottom:10px;
}

.progress{
  height:8px;
  background:#24243a;
  border-radius:20px;
  overflow:hidden;
  margin:8px 0 20px;
}

.bar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#6d45ff,#d34cff);
  transition:.3s;
}

.question{
  font-size:21px;
  font-weight:700;
  line-height:1.4;
  margin:15px 0 20px;
}

.opt{
  display:block;
  width:100%;
  text-align:left;
  background:#19192b;
  color:#fff;
  border:1px solid #30304a;
  border-radius:14px;
  padding:14px;
  margin:9px 0;
  font-size:16px;
  cursor:pointer;
}

.opt.correct{
  border-color:#39d98a;
  background:#123728;
}

.opt.wrong{
  border-color:#ff5c6c;
  background:#3b1720;
}

.opt:disabled{
  opacity:1;
}

/* RESULT */
.score{
  text-align:center;
  font-size:50px;
  font-weight:900;
  margin:15px 0;
}

.center{
  text-align:center;
}

.small{
  color:#aaa;
  line-height:1.5;
}

.err{
  background:#3a1720;
  border:1px solid #ff5c6c;
  padding:14px;
  border-radius:14px;
  margin-top:14px;
  color:#ffd9de;
  word-break:break-word;
}

@media(max-width:420px){
  .cat{
    min-height:68px;
    font-size:13px;
    padding:9px 6px;
  }

  .question{
    font-size:19px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<!-- KATEGORIYA -->
<div id="home">

  <div class="top">
    <div class="logo">🧠</div>

    <div class="title">
      AQLJANGI
    </div>

    <div class="sub">
      O‘zingiz xohlagan kategoriyani tanlang
    </div>

    <div class="badges">
      <div class="badge">🎯 10 ta savol</div>
      <div class="badge">⭐ 100 ball</div>
      <div class="badge">🏆 TOPQIR</div>
    </div>
  </div>

  <div class="card">

    <div class="category-title">
      📚 Fan tanlang
    </div>

    <div class="categories">

      <button class="cat" data-category="Mantiq">
        🧠<br>Mantiq
      </button>

      <button class="cat" data-category="Tarix">
        📜<br>Tarix
      </button>

      <button class="cat" data-category="Geografiya">
        🌍<br>Geografiya
      </button>

      <button class="cat" data-category="Biologiya">
        🧬<br>Biologiya
      </button>

      <button class="cat" data-category="Fan">
        🔬<br>Fan
      </button>

      <button class="cat" data-category="Texnologiya">
        💻<br>Texnologiya
      </button>

      <button class="cat" data-category="O‘zbekiston">
        🇺🇿<br>O‘zbekiston
      </button>

      <button class="cat" data-category="Adabiyot">
        📚<br>Adabiyot
      </button>

      <button class="cat" data-category="Matematika">
        ➗<br>Matematika
      </button>

      <button class="cat" data-category="Umumiy bilim">
        🎯<br>Umumiy bilim
      </button>

    </div>

    <div id="homeErr"></div>

  </div>
</div>


<!-- O‘YIN -->
<div id="game" class="hide">

  <button class="btn back" id="backBtn">
    ↩️ Kategoriyalarga qaytish
  </button>

  <div class="card">

    <div class="game-head">
      <span id="categoryName">Mantiq</span>
      <span id="scoreTop">⭐ 0</span>
    </div>

    <div class="game-head">
      <span id="qnum">1 / 10</span>
      <span>10 ball</span>
    </div>

    <div class="progress">
      <div class="bar" id="bar"></div>
    </div>

    <div class="question" id="question">
      Yuklanmoqda...
    </div>

    <div id="options"></div>

    <button class="btn hide" id="nextBtn">
      Keyingi savol ➜
    </button>

  </div>
</div>


<!-- NATIJA -->
<div id="result" class="hide">

  <div class="card center">

    <div class="logo">
      🏆
    </div>

    <h2>Natija</h2>

    <div class="small" id="resultCategory"></div>

    <div class="score" id="score">
      0 / 100
    </div>

    <div class="small" id="resultText"></div>

    <button class="btn" id="againBtn">
      🔄 Qayta o‘ynash
    </button>

    <button class="btn back" id="categoryBtn">
      📚 Boshqa fan
    </button>

  </div>

</div>

</div>


<script>

/* TELEGRAM */
const tg =
  window.Telegram &&
  window.Telegram.WebApp
  ? window.Telegram.WebApp
  : null;

if(tg){
  tg.ready();
  tg.expand();
}


/* SUPABASE */
const SUPABASE_URL =
  "https://ayzdzhodjdzsoxovckrc.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_SVjbLTpmwn4z3lYtC3kZhg_obMt1k8p";

const GAME_SIZE = 10;


/* O‘YIN O‘ZGARUVCHILARI */
let questions = [];
let index = 0;
let score = 0;
let answered = false;
let selectedCategory = "";


/* HTML XAVFSIZLIK */
function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g, function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m];

    });

}


/* RANDOM ARALASHTIRISH */
function shuffle(array){

  array = [...array];

  for(
    let i = array.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      array[i],
      array[j]
    ] =
    [
      array[j],
      array[i]
    ];

  }

  return array;
}


/*
  MUHIM:
  BU YERDA "id" YO‘Q!

  Eski kodda:
  select=id,question,...

  edi.

  Endi:
  select=question,...

  Shuning uchun:
  questions.id does not exist
  xatosi chiqmaydi.
*/


async function fetchQuestions(category){

  const encoded =
    encodeURIComponent(category);

  const random =
    Math.random();


  /* 1-USUL */

  const url1 =
    SUPABASE_URL +
    "/rest/v1/questions" +
    "?select=question,option_a,option_b,option_c,option_d,correct_answer,category" +
    "&category=eq." +
    encoded +
    "&random_key=gte." +
    random +
    "&order=random_key.asc" +
    "&limit=" +
    GAME_SIZE;


  let response =
    await fetch(
      url1,
      {
        method:"GET",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY
        }
      }
    );


  if(response.ok){

    const data =
      await response.json();

    if(
      Array.isArray(data) &&
      data.length > 0
    ){

      return shuffle(data)
        .slice(0,GAME_SIZE);

    }

  }


  /* 2-USUL */

  const url2 =
    SUPABASE_URL +
    "/rest/v1/questions" +
    "?select=question,option_a,option_b,option_c,option_d,correct_answer,category" +
    "&category=eq." +
    encoded +
    "&random_key=lt." +
    random +
    "&order=random_key.desc" +
    "&limit=" +
    GAME_SIZE;


  response =
    await fetch(
      url2,
      {
        method:"GET",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY
        }
      }
    );


  if(response.ok){

    const data =
      await response.json();

    if(
      Array.isArray(data) &&
      data.length > 0
    ){

      return shuffle(data)
        .slice(0,GAME_SIZE);

    }

  }


  const errorText =
    await response.text();

  throw new Error(
    "Supabase API xatosi: " +
    response.status +
    " " +
    errorText
  );

}


/* O‘YINNI BOSHLASH */

async function startGame(category){

  selectedCategory = category;

  document
    .getElementById("homeErr")
    .innerHTML = "";

  document
    .querySelectorAll(".cat")
    .forEach(
      button => button.disabled = true
    );


  try{

    questions =
      await fetchQuestions(category);


    if(
      !questions ||
      !questions.length
    ){

      throw new Error(
        "Bu kategoriyada savollar topilmadi."
      );

    }


    index = 0;
    score = 0;
    answered = false;


    document
      .getElementById("home")
      .classList.add("hide");

    document
      .getElementById("result")
      .classList.add("hide");

    document
      .getElementById("game")
      .classList.remove("hide");


    document
      .getElementById("categoryName")
      .textContent = category;

    document
      .getElementById("scoreTop")
      .textContent = "⭐ 0";


    if(
      tg &&
      tg.BackButton
    ){

      tg.BackButton.show();

      tg.BackButton.onClick(
        goCategories
      );

    }


    showQuestion();


  }catch(error){

    document
      .getElementById("homeErr")
      .innerHTML =
      '<div class="err">' +
      '❌ Savollarni yuklashda xato.<br><br>' +
      esc(error.message) +
      '</div>';

  }finally{

    document
      .querySelectorAll(".cat")
      .forEach(
        button => button.disabled = false
      );

  }

}


/* SAVOLNI KO‘RSATISH */

function showQuestion(){

  answered = false;

  const q =
    questions[index];


  document
    .getElementById("qnum")
    .textContent =
    (index + 1) +
    " / " +
    questions.length;


  document
    .getElementById("bar")
    .style.width =
    ((index / questions.length) * 100) +
    "%";


  document
    .getElementById("question")
    .textContent =
    q.question || "Savol";


  const options = [

    ["A", q.option_a],

    ["B", q.option_b],

    ["C", q.option_c],

    ["D", q.option_d]

  ];


  const box =
    document.getElementById("options");


  box.innerHTML =
    options
      .map(
        function(item){

          const key = item[0];
          const value = item[1];

          return `
            <button
              class="opt"
              data-key="${key}"
            >
              <b>${key}.</b>
              ${esc(value)}
            </button>
          `;

        }
      )
      .join("");


  box
    .querySelectorAll(".opt")
    .forEach(
      button => {

        button.onclick =
          () =>
          answer(
            button,
            q.correct_answer
          );

      }
    );


  document
    .getElementById("nextBtn")
    .classList
    .add("hide");

}


/* JAVOB */

function answer(
  button,
  correct
){

  if(answered){
    return;
  }

  answered = true;


  const selected =
    button.dataset.key;


  const right =
    String(correct || "")
      .trim()
      .toUpperCase();


  document
    .querySelectorAll(".opt")
    .forEach(
      option => {

        option.disabled = true;

        if(
          option.dataset.key === right
        ){

          option.classList
            .add("correct");

        }

      }
    );


  if(selected === right){

    score += 10;

  }else{

    button.classList
      .add("wrong");

  }


  document
    .getElementById("scoreTop")
    .textContent =
    "⭐ " + score;


  document
    .getElementById("bar")
    .style.width =
    (
      ((index + 1) /
      questions.length) *
      100
    ) + "%";


  const next =
    document
      .getElementById("nextBtn");


  next.textContent =
    index === questions.length - 1
    ? "🏆 Natijani ko‘rish"
    : "Keyingi savol ➜";


  next.classList
    .remove("hide");


  if(
    tg &&
    tg.HapticFeedback
  ){

    tg.HapticFeedback
      .impactOccurred(
        selected === right
        ? "light"
        : "medium"
      );

  }

}


/* KEYINGI SAVOL */

function nextQuestion(){

  if(!answered){
    return;
  }


  if(
    index <
    questions.length - 1
  ){

    index++;

    showQuestion();

  }else{

    showResult();

  }

}


/* NATIJA */

function showResult(){

  document
    .getElementById("game")
    .classList
    .add("hide");


  document
    .getElementById("result")
    .classList
    .remove("hide");


  document
    .getElementById("score")
    .textContent =
    score + " / 100";


  document
    .getElementById("resultCategory")
    .textContent =
    "📚 " + selectedCategory;


  let text;


  if(score >= 90){

    text = "🔥 Ajoyib natija!";

  }else if(score >= 70){

    text = "👏 Juda yaxshi!";

  }else if(score >= 50){

    text = "👍 Yaxshi!";

  }else{

    text = "💪 Yana urinib ko‘ring!";

  }


  document
    .getElementById("resultText")
    .textContent = text;


  if(
    tg &&
    tg.BackButton
  ){

    tg.BackButton.hide();

  }

}


/* KATEGORIYALARGA QAYTISH */

function goCategories(){

  document
    .getElementById("game")
    .classList
    .add("hide");


  document
    .getElementById("result")
    .classList
    .add("hide");


  document
    .getElementById("home")
    .classList
    .remove("hide");


  if(
    tg &&
    tg.BackButton
  ){

    tg.BackButton.hide();

  }

}


/* KATEGORIYALAR */

document
  .querySelectorAll(".cat")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        function(){

          startGame(
            button.dataset.category
          );

        }
      );

    }
  );


/* TUGMALAR */

document
  .getElementById("nextBtn")
  .onclick =
  nextQuestion;


document
  .getElementById("backBtn")
  .onclick =
  goCategories;


document
  .getElementById("againBtn")
  .onclick =
  function(){

    startGame(
      selectedCategory
    );

  };


document
  .getElementById("categoryBtn")
  .onclick =
  goCategories;

</script>

</body>
</html>
